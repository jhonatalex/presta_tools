<!-- SECCIÓN NAVBAR MODERNA -->
<header class="main-header-wrapper">
  <nav class="navbar navbar-expand-lg navbar-dark modern-navbar">
    <div class="container-fluid px-lg-4">
      
      <!-- LOGO -->
      <a class="navbar-brand d-flex align-items-center" routerLink="/">
        <img src="assets/img/logo.png" alt="PrestaTools Logo" class="brand-logo" [class.brand-logo-compact]="!flaglogo">
      </a>

      <!-- TOGGLER MOBILE -->
      <button class="navbar-toggler modern-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerMain" aria-controls="navbarTogglerMain" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fa fa-bars text-white fs-4"></i>
      </button>

      <!-- MENU COLLAPSE -->
      <div class="collapse navbar-collapse" id="navbarTogglerMain">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 nav-center-links">
          <li class="nav-item">
            <a class="nav-link modern-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link modern-nav-link" href="#productos-destacados">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link modern-nav-link" href="#categorias">Categorías</a>
          </li>
          <li class="nav-item">
            <a class="nav-link modern-nav-link highlight-link" [routerLink]="['/agregar-producto']">
              <i class="fa fa-plus-circle me-1"></i> Alquila Tu Producto
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link modern-nav-link" [routerLink]="['/contacto']">Contacto</a>
          </li>
        </ul>

        <!-- AUTH ACTIONS -->
        <div class="d-flex align-items-center nav-auth-actions">
          
          <!-- LOGGED IN USER -->
          <div *ngIf="user" class="user-profile-badge d-flex align-items-center">
            <div class="user-avatar-circle me-2">
              <i class="fa fa-user"></i>
            </div>
            <div class="user-info-text text-start me-3 d-none d-sm-block">
              <span class="user-full-name d-block">{{user.name}} {{user.lastName}}</span>
              <span class="user-role-badge badge bg-primary text-capitalize">{{user.typeUser || 'Usuario'}}</span>
            </div>
            <button class="btn btn-sm btn-outline-danger btn-logout-modern" (click)="signOut()" title="Cerrar Sesión">
              <i class="fa fa-sign-out"></i> <span class="d-none d-md-inline ms-1">Salir</span>
            </button>
          </div>

          <!-- GUEST ACTIONS (NOT LOGGED IN) -->
          <div *ngIf="!user" class="guest-auth-buttons d-flex align-items-center gap-2">
            <a class="btn-ghost-nav" [routerLink]="['/acceso']">Iniciar Sesión</a>
            <a class="btn-primary-grad" [routerLink]="['/registro']">Regístrate gratis</a>
          </div>

        </div>

      </div>

    </div>
  </nav>
</header>
