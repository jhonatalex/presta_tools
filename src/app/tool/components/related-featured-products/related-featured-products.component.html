<div class="container-fluid px-3 px-md-5">
  <ngx-slick-carousel class="carousel product-carousel-wrapper" #slickModal="slick-carousel" [config]="slideConfig" responsive="breakpoints"
      (init)="slickInit($event)" (breakpoint)="breakpoint($event)" (afterChange)="afterChange($event)"
      (beforeChange)="beforeChange($event)">

    <div ngxSlickItem *ngFor="let tool of tools" class="p-2">
      
      <!-- MODERN PRODUCT CARD -->
      <div class="presta-product-card">
        
        <!-- STATUS BADGE -->
        <div class="card-status-badge" [class.badge-reserved]="tool.state === 'rentado'">
          <span class="badge-dot-indicator"></span>
          {{ tool.state === 'rentado' ? 'Reservado' : 'Disponible' }}
        </div>

        <!-- IMAGE WRAPPER -->
        <div class="card-image-box">
          <img [src]="tool.urlImage || 'assets/img/tool-placeholder.png'" [alt]="tool.name" class="card-product-img" loading="lazy">
        </div>

        <!-- CONTENT -->
        <div class="card-product-body">
          
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="category-meta-text">{{ tool.brand || 'Herramienta' }}</span>
            <span class="rating-badge">
              <i class="fa fa-star text-warning"></i> {{ tool.rate || 5.0 }}
            </span>
          </div>

          <h5 class="card-tool-name" [title]="tool.name + ' ' + (tool.model || '')">
            {{tool.name}} {{tool.model}}
          </h5>

          <!-- PRICING -->
          <div class="card-price-row mt-2 mb-3">
            <span class="price-val">${{ (tool.valueRent || 0) | number }}</span>
            <span class="price-period">CLP / día</span>
          </div>

          <!-- ACTION BUTTON -->
          <div class="mt-auto">
            <div *ngIf="tool.state === 'rentado'" class="reserved-date-box text-center">
              <i class="fa fa-calendar-times-o me-1"></i> Disponible tras: <strong>{{ tool.dateUp | date: 'dd/MM/yyyy' }}</strong>
            </div>

            <div *ngIf="tool.state !== 'rentado'">
              <a [routerLink]="['/producto/', tool.id]" class="btn-product-reserve">
                <span>Reservar</span>
                <i class="fa fa-arrow-right icon-arrow-slide"></i>
              </a>
            </div>
          </div>

        </div>

      </div>

    </div>

  </ngx-slick-carousel>
</div>
