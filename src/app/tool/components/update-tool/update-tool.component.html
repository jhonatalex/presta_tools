<!-- HEADER NAVBAR -->
<app-header [flaglogo]="false"></app-header>

<div class="tool-form-page py-5">
  <div class="container">
    <div class="tool-form-container mx-auto">

      <!-- ENCABEZADO -->
      <div class="form-hero-card p-4 p-md-5 mb-4">
        <div class="d-flex align-items-center gap-3">
          <div class="form-avatar-box">
            <i class="fa fa-pencil"></i>
          </div>
          <div>
            <span class="badge-form-tag">Edición de Equipos</span>
            <h1 class="form-hero-title mt-1 mb-0">Actualizar Herramienta</h1>
            <p class="text-slate-500 fs-7 mb-0">Modifica los detalles técnicos, precio o fotos de tu publicación.</p>
          </div>
        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="tool-form-card p-4 p-md-5">
        <form #updateToolForm="ngForm" (ngSubmit)="onSubmit(updateToolForm)">
          <div class="row g-4">

            <!-- COLUMNA IZQUIERDA -->
            <div class="col-lg-7">
              <h5 class="section-subheading mb-3">1. Información del Equipo</h5>

              <div class="mb-3">
                <label class="field-label">Nombre de la Herramienta</label>
                <input
                  type="text"
                  class="modern-input"
                  id="name"
                  name="name"
                  placeholder="Nombre"
                  #name="ngModel"
                  [(ngModel)]="tool.name"
                  required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="field-label">Marca</label>
                  <input
                    type="text"
                    class="modern-input"
                    id="brand"
                    name="brand"
                    placeholder="Marca"
                    #brand="ngModel"
                    [(ngModel)]="tool.brand"
                    required>
                </div>
                <div class="col-md-6">
                  <label class="field-label">Modelo</label>
                  <input
                    type="text"
                    class="modern-input"
                    id="model"
                    name="model"
                    placeholder="Modelo"
                    #model="ngModel"
                    [(ngModel)]="tool.model"
                    required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="field-label">Código / Referencia</label>
                  <input
                    type="text"
                    class="modern-input"
                    id="reference"
                    name="reference"
                    placeholder="Referencia"
                    #reference="ngModel"
                    [(ngModel)]="tool.reference"
                    required>
                </div>
                <div class="col-md-6">
                  <label class="field-label">Tiempo de Uso (meses)</label>
                  <input
                    type="number"
                    class="modern-input"
                    id="timeUse"
                    name="timeUse"
                    placeholder="Meses"
                    #timeUse="ngModel"
                    [(ngModel)]="tool.timeUse"
                    required>
                </div>
              </div>

              <div class="mb-3">
                <label class="field-label">Descripción</label>
                <textarea
                  class="modern-input"
                  rows="3"
                  id="description"
                  name="description"
                  #description="ngModel"
                  [(ngModel)]="tool.description"
                  required></textarea>
              </div>
            </div>

            <!-- COLUMNA DERECHA -->
            <div class="col-lg-5">
              <h5 class="section-subheading mb-3">2. Precios y Estado</h5>

              <div class="mb-4 p-3 bg-light-slate rounded-3 border">
                <label class="field-label">Precio de Alquiler por Día (CLP)</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 fw-bold text-sky-500">$</span>
                  <input
                    type="number"
                    class="modern-input border-start-0"
                    id="valueRent"
                    name="valueRent"
                    [(ngModel)]="tool.valueRent"
                    required>
                </div>
              </div>

              <div class="mb-4 form-check form-switch p-3 bg-light-slate rounded-3 border ps-5">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="widgets"
                  name="widgets"
                  [(ngModel)]="tool.widgets">
                <label class="form-check-label fw-semibold text-slate-800" for="widgets">
                  Incluye accesorios
                </label>
              </div>

              <div class="preview-box mb-4 text-center" *ngIf="tool.urlImage">
                <img [src]="tool.urlImage" alt="Preview" class="rounded-3 border" style="max-height: 140px; object-fit: contain;">
              </div>

              <button
                type="submit"
                class="btn-primary-grad w-100 py-3"
                [disabled]="updateToolForm.invalid">
                <span>Guardar Cambios</span>
                <i class="fa fa-save ms-2"></i>
              </button>
            </div>

          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<app-footer></app-footer>
